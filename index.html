<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef2ff">
  <title>Digital Laboratory</title>

  <link rel="stylesheet" href="assets/css/styles.css">

  <style>
    :root {
      --blue: #2563eb;
      --purple: #7c3aed;
      --pink: #db2777;
      --cyan: #06b6d4;
      --ink: #172554;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      color: var(--ink);
      background: linear-gradient(135deg, #f0f7ff, #f4edff, #fff1f8);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    /* Colorful background */
    .bg-decor .orb-a {
      background: radial-gradient(circle, #60a5fa, #818cf8, transparent 70%);
      opacity: .5;
    }

    .bg-decor .orb-b {
      background: radial-gradient(circle, #f0abfc, #c084fc, transparent 70%);
      opacity: .5;
    }

    /* Glass-style header */
    .topbar {
      background: rgba(255, 255, 255, .88) !important;
      backdrop-filter: blur(18px);
      border-bottom: 1px solid #ddd6fe;
      box-shadow: 0 8px 30px #312e8110;
    }

    .topbar__brand {
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .topbar__lab [data-bind="laboratory.name"],
    .footer__brandlab {
      background: linear-gradient(90deg, #2563eb, #7c3aed, #db2777);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent !important;
    }

    .topbar__tag {
      color: var(--purple) !important;
    }

    .chip {
      background: linear-gradient(110deg, #dbeafe, #f3e8ff) !important;
      color: #4338ca !important;
      border: 1px solid #c4b5fd;
      border-radius: 50px;
    }

    /* Sidebar */
    .sidebar {
      background: rgba(255, 255, 255, .9) !important;
      backdrop-filter: blur(15px);
      border-right: 1px solid #ddd6fe;
    }

    .sidebar__link {
      margin: 5px 10px;
      border-radius: 14px;
      transition: .25s ease;
    }

    .sidebar__link:hover {
      transform: translateX(4px);
      background: linear-gradient(100deg, #dbeafe, #f3e8ff) !important;
      color: #4f46e5 !important;
    }

    .sidebar__link.active,
    .sidebar__link[aria-current="page"] {
      color: white !important;
      background: linear-gradient(110deg, #2563eb, #7c3aed, #a855f7) !important;
      box-shadow: 0 8px 22px #7c3aed35;
    }

    .sidebar__link.active .sidebar__icon,
    .sidebar__link[aria-current="page"] .sidebar__icon {
      color: white !important;
    }

    /* Main page */
    .main-content {
      min-height: 65vh;
    }

    .main-content h1 {
      color: #312e81;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .main-content h2,
    .main-content h3 {
      color: #4338ca;
      letter-spacing: -.4px;
    }

    /* Cards */
    .main-content :is(.card,
      .module-card,
      .experiment-card,
      .tool-card,
      .project-card,
      .panel,
      .profile-card) {
      border: 1px solid #e0e7ff;
      border-radius: 20px;
      box-shadow: 0 10px 30px #312e8110;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .main-content :is(.card,
      .module-card,
      .experiment-card,
      .tool-card,
      .project-card,
      .panel,
      .profile-card):hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 35px #7c3aed20;
    }

    /* Buttons */
    .main-content button,
    .main-content .btn,
    .main-content [role="button"] {
      border-radius: 12px;
      transition: .2s ease;
    }

    .main-content button:hover,
    .main-content .btn:hover,
    .main-content [role="button"]:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    /* Form fields */
    .main-content input,
    .main-content select,
    .main-content textarea {
      border: 1px solid #c7d2fe !important;
      border-radius: 12px !important;
      background: #ffffffee !important;
    }

    .main-content input:focus,
    .main-content select:focus,
    .main-content textarea:focus {
      outline: 3px solid #818cf830;
      border-color: #818cf8 !important;
    }

    /* Footer */
    .footer {
      background: #ffffffb8 !important;
      border-top: 1px solid #ddd6fe;
      backdrop-filter: blur(12px);
    }

    /* Mobile */
    @media (max-width: 760px) {
      .topbar {
        padding-inline: 12px;
      }

      .main-content {
        padding-inline: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="bg-decor" aria-hidden="true">

      aria-label="Toggle navigation menu">

  <div class="app-layout">

      <nav class="sidebar__nav">

      <p class="footer__line">

  <script src="assets/js/data.js"></script>
  <script src="assets/js/codelab-py.js"></script>
  <script src="assets/js/codelab.js"></script>
  <script src="assets/js/app.js"></script>
</body>

</html>
